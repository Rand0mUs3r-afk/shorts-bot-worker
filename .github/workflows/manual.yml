name: Private processing
on:
  workflow_dispatch:
    inputs:
      max_shorts:
        description: Maximum Shorts per NEW source (5 preferred; 10 maximum)
        required: true
        type: choice
        options: ['5', '10']
        default: '5'
permissions:
  contents: read
concurrency:
  group: private-channel-processing
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'Rand0mUs3r-afk/shorts-bot-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - name: Initialize private report
        id: init
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
        run: python3 diagnostics.py start
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.11'
      - name: Offline checks
        id: checks
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
        run: |
          python3 diagnostics.py stage offline_checks
          python -m unittest discover -s tests > /dev/null 2>&1
      - name: Record preparation
        id: node_marker
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
        run: python3 diagnostics.py stage setup_node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node
        with:
          node-version: '22'
      - name: Record preparation
        id: deps_marker
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
        run: python3 diagnostics.py stage dependencies
      - name: Prepare
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y ffmpeg > /dev/null 2>&1
          python -m pip install --no-cache-dir -r requirements.txt > /dev/null 2>&1
      - name: Process
        id: process
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
          MAX_SHORTS_PER_VIDEO: ${{ inputs.max_shorts || '5' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          MADE_FOR_KIDS: ${{ vars.QUEUE_MADE_FOR_KIDS || 'false' }}
        run: python quality.py
      - name: Finalize private report
        if: always() && steps.checkout.outcome == 'success'
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
          WORKFLOW_STEPS: ${{ toJSON(steps) }}
        run: python3 diagnostics.py finish
