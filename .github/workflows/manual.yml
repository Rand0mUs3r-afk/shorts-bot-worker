name: Private processing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-channel-processing
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main' && github.repository == 'Rand0mUs3r-afk/shorts-bot-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Offline checks
        run: python -m unittest discover -s tests > /dev/null 2>&1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y ffmpeg > /dev/null 2>&1
          python -m pip install --no-cache-dir -r requirements.txt > /dev/null 2>&1
      - name: Process
        env:
          PRIVATE_STATE_REPO: ${{ secrets.PRIVATE_STATE_REPO }}
          PRIVATE_STATE_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          MADE_FOR_KIDS: ${{ vars.QUEUE_MADE_FOR_KIDS || 'false' }}
        run: python quiet.py
